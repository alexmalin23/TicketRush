# Local development (API on the host with `npm run dev`): `docker compose up -d`
#   → Postgres + Redis only.
# Whole stack in containers (load tests, demos): `docker compose --profile full up -d --build`
#   → also runs migrations and the API (host port 3080). `npm run load` does this on its own.
x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/modex
  REDIS_URL: redis://redis:6379
  # Local development value only; real environments inject a secret.
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  ENABLE_DEV_ROUTES: ${ENABLE_DEV_ROUTES:-true}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: modex
    ports:
      - "127.0.0.1:5432:5432" # reachable only from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on the first start: creates the separate test database
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # appendonly: persist every write to disk (remove if Redis is only a cache)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379" # no password, so never expose it to the network
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies pending migrations, then exits. An advisory lock makes it
  # safe even if several of these run at once.
  migrate:
    profiles: [full]
    build: .
    image: ticketrush-api
    command: ["node", "dist/database/migrate.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  # Mock card processor: an external system from the API's point of view (own process, own state).
  payments:
    profiles: [full]
    build: .
    image: ticketrush-api
    command: ["node", "dist/payments-provider/main.js"]
    environment:
      PAYMENTS_PROVIDER_PORT: 3100
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MOCK_PAYMENT_LATENCY_MS_MIN: ${MOCK_PAYMENT_LATENCY_MS_MIN:-300}
      MOCK_PAYMENT_LATENCY_MS_MAX: ${MOCK_PAYMENT_LATENCY_MS_MAX:-1500}
      MOCK_PAYMENT_FAILURE_RATE: ${MOCK_PAYMENT_FAILURE_RATE:-0.1}
      MOCK_PAYMENT_TIMEOUT_RATE: ${MOCK_PAYMENT_TIMEOUT_RATE:-0.02}
    ports:
      # 3180 on the host, like the API's 3080: `npm run dev:payments` owns 3100 locally.
      - "127.0.0.1:3180:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    profiles: [full]
    build: .
    image: ticketrush-api
    environment:
      <<: *app-env
      PORT: 3000
      PAYMENTS_PROVIDER_URL: http://payments:3100
    ports:
      # Host port 3080, not 3000: `npm run dev` owns 3000 on the host, and two servers on one
      # port silently split requests by address family. k6 uses api:3000 inside the network.
      - "127.0.0.1:3080:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      # Liveness only: a database outage must not mark API instances unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Load generator. Only started on demand (`npm run load -- <scenario>`), never by `up`.
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    volumes:
      - ./load:/load
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
