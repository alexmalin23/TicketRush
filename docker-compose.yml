# Local development (API on the host with `npm run dev`): `docker compose up -d`
#   → Postgres + Redis only.
# Whole stack in containers (load tests, demos): `docker compose --profile full up -d --build`
#   → also runs migrations, the API replicas and the load balancer (host port 3080).
#   `npm run load` does this on its own. API_REPLICAS=1 reproduces the single-instance baseline;
#   LB_METHOD=round-robin switches the balancing method (default least-conn).
# Read replica: add `--profile replica` and set READ_ROUTING=replica.
x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/modex
  # Used only with READ_ROUTING=replica, which needs the replica profile running.
  DATABASE_REPLICA_URL: postgres://postgres:postgres@postgres-replica:5432/modex
  READ_ROUTING: ${READ_ROUTING:-primary}
  # false = every read goes to Postgres (benchmark baseline).
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  # Per replica: replicas x DB_POOL_MAX must stay under Postgres max_connections (100).
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  # postgres = holds in seat rows (stage 1 baseline); redis = holds as keys with a TTL.
  HOLD_STORE: ${HOLD_STORE:-postgres}
  # memory reproduces the per-replica limiter baseline (limit x replicas).
  RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
  # async = 202 and charge in the worker; sync = charge inside the request (benchmark baseline).
  ORDER_PROCESSING: ${ORDER_PROCESSING:-async}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
  WAITING_ROOM_ENABLED: ${WAITING_ROOM_ENABLED:-false}
  WAITING_ROOM_ADMIT_PER_SECOND: ${WAITING_ROOM_ADMIT_PER_SECOND:-50}
  # Local development value only; real environments inject a secret.
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Fixed, not read from .env: that file holds the host's `npm run dev` settings (false there),
  # and every load scenario resets the event through these routes. This stack is local only.
  ENABLE_DEV_ROUTES: "true"

services:
  postgres:
    image: postgres:16
    # pg_hba.conf of the image plus replication from the Compose network.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: modex
    ports:
      - "127.0.0.1:5432:5432" # reachable only from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on the first start: creates the separate test database
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Read-only streaming replica of postgres. The first start copies the primary (pg_basebackup);
  # -R makes the copy a standby that keeps applying the primary's WAL. Later starts reuse the copy.
  postgres-replica:
    profiles: [replica]
    image: postgres:16
    environment:
      PGPASSWORD: postgres
    entrypoint:
      - bash
      - -c
      - '[ -s "$$PGDATA/PG_VERSION" ] || pg_basebackup -h postgres -U postgres -D "$$PGDATA" -R -X stream || exit 1; exec docker-entrypoint.sh postgres'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # appendonly: persist every write to disk (remove if Redis is only a cache)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379" # no password, so never expose it to the network
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies pending migrations, then exits. An advisory lock makes it
  # safe even if several of these run at once.
  migrate:
    profiles: [full]
    build: .
    image: ticketrush-api
    command: ["node", "dist/database/migrate.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  # Mock card processor: an external system from the API's point of view (own process, own state).
  payments:
    profiles: [full]
    build: .
    image: ticketrush-api
    command: ["node", "dist/payments-provider/main.js"]
    environment:
      PAYMENTS_PROVIDER_PORT: 3100
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MOCK_PAYMENT_LATENCY_MS_MIN: ${MOCK_PAYMENT_LATENCY_MS_MIN:-300}
      MOCK_PAYMENT_LATENCY_MS_MAX: ${MOCK_PAYMENT_LATENCY_MS_MAX:-1500}
      MOCK_PAYMENT_FAILURE_RATE: ${MOCK_PAYMENT_FAILURE_RATE:-0.1}
      MOCK_PAYMENT_TIMEOUT_RATE: ${MOCK_PAYMENT_TIMEOUT_RATE:-0.02}
    ports:
      # 3180 on the host, like the API's 3080: `npm run dev:payments` owns 3100 locally.
      - "127.0.0.1:3180:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Stateless: any replica can serve any request. No host port: traffic enters through lb.
  api:
    profiles: [full]
    build: .
    image: ticketrush-api
    deploy:
      replicas: ${API_REPLICAS:-3}
    environment:
      <<: *app-env
      PORT: 3000
      PAYMENTS_PROVIDER_URL: http://payments:3100
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      # Liveness only: a database outage must not mark API instances unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Takes payment jobs off the queue. No port: it talks to Redis, Postgres and the provider only.
  worker:
    profiles: [full]
    build: .
    image: ticketrush-api
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      PAYMENTS_PROVIDER_URL: http://payments:3100
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      payments:
        condition: service_healthy
    restart: unless-stopped

  lb:
    profiles: [full]
    image: nginx:1.27.3-alpine
    environment:
      LB_METHOD: ${LB_METHOD:-least-conn}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/balancing:/etc/nginx/balancing:ro
    ports:
      # Host port 3080, not 3000: `npm run dev` owns 3000 on the host, and two servers on one
      # port silently split requests by address family. k6 uses lb:80 inside the network.
      - "127.0.0.1:3080:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started # `npm run load` starts only what lb depends on
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # `docker compose --profile full --profile observability up -d`: Prometheus on 9090, Grafana on 3001.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local only: bound to 127.0.0.1
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # Load generator. Only started on demand (`npm run load -- <scenario>`), never by `up`.
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    volumes:
      - ./load:/load
    environment:
      BASE_URL: http://lb
    depends_on:
      lb:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
