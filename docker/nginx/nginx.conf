# Load balancer in front of the API replicas. The upstream lives in templates/ so the
# balancing method can be switched per run (LB_METHOD) without editing this file.
worker_processes auto;

events {
  # Each buyer holds one client connection; 1,024 (the default) caps a run at about 1,000 users.
  worker_connections 8192;
}

http {
  # The API already logs every request with its requestId; a second log line per request
  # only costs disk writes during a load run.
  access_log off;
  include /etc/nginx/conf.d/*.conf;
}
